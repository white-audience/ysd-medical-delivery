name: Bug 报告
description: 报告可复现的功能或配置问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，并删除日志中的 token、密码、AccessKey、手机号等敏感信息。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 ...
        2. 请求 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 分支名或 commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: OS、JDK、Maven、Docker、Node 版本，以及是否使用 Compose
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请先脱敏；没有可留空
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 我已移除日志中的真实凭据和个人信息
          required: true
