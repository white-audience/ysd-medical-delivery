name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前的不便或缺口是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何实现？是否有替代方案？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 涉及哪些模块 / 接口 / 文档？
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 和文档
          required: true
