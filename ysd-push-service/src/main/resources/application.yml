# ysd-push-service 配置（端口 8086，服务名 ysd-push-service）
# 只做 WebSocket：无业务库、无定时任务；订阅 RabbitMQ 的 ws.broadcast 广播。
server:
  port: 8086
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: ysd-push-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 消费端：开启 observation 从消息头恢复 trace 上下文（默认 false，不开则 MQ 链路断链）
    listener:
      simple:
        observation-enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        ip: 127.0.0.1
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
management:
  tracing:
    sampling:
      probability: 1.0        # 本地全采样；TODO 生产改 0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
